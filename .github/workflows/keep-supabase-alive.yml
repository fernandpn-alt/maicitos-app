name: Keep Supabase Alive

on:
  schedule:
    # Ejecuta cada 4 días a las 12:00 UTC para evitar pausa por inactividad en Supabase Free
    - cron: '0 12 */4 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ligero a Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL / SUPABASE_ANON_KEY no configurados todavía; omitiendo ping."
            exit 0
          fi

          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/locations?select=id&limit=1"
